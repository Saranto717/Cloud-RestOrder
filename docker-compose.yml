name: cloud-restorder

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_cloud}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-restaurant_cloud_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      CLOUD_APP_USER: ${CLOUD_APP_USER:-restaurant_cloud_app}
      CLOUD_APP_PASSWORD_FILE: /run/secrets/cloud_app_password
      TZ: UTC
    secrets:
      - source: postgres_admin_password
        target: postgres_admin_password
        uid: "0"
        gid: "0"
        mode: 0400
      - source: cloud_app_password
        target: cloud_app_password
        uid: "70"
        gid: "70"
        mode: 0400
    volumes:
      - ./init/001-create-app-user.sh:/docker-entrypoint-initdb.d/001-create-app-user.sh:ro
      - postgres-data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  cloud-api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-saranto717}/cloud-restorder:${CLOUD_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Cloud__DatabaseHost: postgres
      Cloud__DatabasePort: "5432"
      Cloud__DatabaseName: ${POSTGRES_DB:-restaurant_cloud}
      Cloud__DatabaseUser: ${CLOUD_APP_USER:-restaurant_cloud_app}
      Cloud__DatabasePasswordFile: /run/secrets/cloud_app_password
      Cloud__LicenseManagerEmail: ${LICENSE_MANAGER_EMAIL:?Set LICENSE_MANAGER_EMAIL in Dockhand}
      Cloud__LicenseManagerPasswordFile: /run/secrets/license_manager_password
      Cloud__LicenseSigningPrivateKeyFile: /var/lib/restaurantorders/license-signing-private.pem
      Cloud__TrustedProxyAddresses: ${CLOUD_TRUSTED_PROXY_ADDRESSES:-}
    secrets:
      - source: cloud_app_password
        target: cloud_app_password
        uid: "1654"
        gid: "1654"
        mode: 0400
      - source: license_manager_password
        target: license_manager_password
        uid: "1654"
        gid: "1654"
        mode: 0400
    volumes:
      - license-signing-data:/var/lib/restaurantorders
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CLOUD_API_BIND_ADDRESS:-0.0.0.0}:${CLOUD_API_PORT:-18081}:8080"
    networks:
      - database

networks:
  database:
    internal: true

volumes:
  postgres-data:
  license-signing-data:

secrets:
  postgres_admin_password:
    environment: POSTGRES_ADMIN_PASSWORD_SECRET
  cloud_app_password:
    environment: CLOUD_APP_PASSWORD_SECRET
  license_manager_password:
    environment: LICENSE_MANAGER_PASSWORD_SECRET

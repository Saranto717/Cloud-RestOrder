name: Build cloud release image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish cloud API and full POS web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "Release tags must point to a commit on main." >&2
            exit 1
          }

      - name: Validate version tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Release tags must use semantic versioning, for example v0.2.0." >&2
            exit 1
          }

      - name: Set image name and version
        id: metadata-values
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cloud-restorder" >> "$GITHUB_OUTPUT"
          echo "image_owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.metadata-values.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            ${{ steps.metadata.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create full POS web image tags
        id: metadata-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.metadata-values.outputs.image_owner }}/cloud-restorder-web
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and publish full POS web app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile.cloud
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata-web.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=RestaurantOrders Full Cloud POS
          cache-from: type=gha,scope=cloud-web
          cache-to: type=gha,scope=cloud-web,mode=max

  build-windows-installer:
    name: Build Windows installer
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw 'Inno Setup 6 compiler was not found after installation.'
          }
          "INNO_SETUP_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows POS installer
        shell: pwsh
        run: .\installer\windows\Build-Installer.ps1 -Version 17.3.136

      - name: Upload installer for release
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            artifacts/installer/RestaurantOrders-Setup-17.3.136-win-x64.exe
            artifacts/installer/RestaurantOrders-Setup-17.3.136-win-x64.exe.sha256
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [publish, build-windows-installer]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/RestaurantOrders-Setup-17.3.136-win-x64.exe \
            release-assets/RestaurantOrders-Setup-17.3.136-win-x64.exe.sha256 \
            --generate-notes --verify-tag

  signal-dockhand:
    name: Signal Dockhand to pull the released image
    needs: create-release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark the deployed release in the source
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_REF_NAME" > .dockhand-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .dockhand-release
          if git diff --cached --quiet; then
            echo "Dockhand release marker is already current."
            exit 0
          fi
          git commit -m "chore: deploy cloud image $GITHUB_REF_NAME"
          git push origin HEAD:main

<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10284b">
  <title>RestaurantOrders · Σύνδεση</title>
  <link rel="stylesheet" href="/pos.css?v=0.3.1">
</head>
<body>
  <div id="http-warning" class="http-warning" hidden>Η σύνδεση είναι διαθέσιμη μόνο μέσω HTTPS.</div>
  <main id="login-view" class="login-shell">
    <section class="login-card">
      <div class="brand-mark">🍽</div>
      <p class="eyebrow">RESTAURANT ORDERS</p>
      <h1>Σύνδεση καταστήματος</h1>
      <p class="subhead">Μετά τη σύνδεση ακολουθείς τη ροή της εφαρμογής και επιλέγεις τον χρήστη σου.</p>
      <form id="login-form">
        <label>Email<input name="email" type="email" autocomplete="username" required maxlength="254"></label>
        <label>Κωδικός<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
        <button class="primary wide" type="submit">Σύνδεση</button>
      </form>
      <p id="login-error" class="notice error" hidden></p>
      <p class="secure-note">Η σύνδεση γίνεται με κρυπτογράφηση HTTPS.</p>
    </section>
  </main>
  <script src="/pos.js?v=0.3.1" defer></script>
</body>
</html>
